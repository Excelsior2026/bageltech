<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="BagelTech icon">
  <!-- Background transparent -->
  <!-- Ring base navy -->
  <circle cx="60" cy="60" r="40" fill="none" stroke="#0F2F4D" stroke-width="18"/>
  <!-- Garnet overlay on right ~70deg arc (32deg to 328deg via east) -->
  <path d="M 93.92 81.18 A 40 40 0 0 0 93.92 38.82" fill="none" stroke="#7B1D2F" stroke-width="18" stroke-linecap="butt"/>
  <!-- White separators (gaps) -->
  <g stroke="#FFFEF7" stroke-width="4.2" stroke-linecap="butt">
    <!-- Left horizontal gap (180deg) -->
    <path d="M 12 60 H 32"/>
    <!-- Upper diagonal gap (328deg / -32deg) -->
    <path d="M 86.2 30.2 L 101.5 20.1"/>
    <!-- Lower diagonal gap (32deg) -->
    <path d="M 86.2 89.8 L 101.5 99.9"/>
  </g>
  <!-- Inner white hole -->
  <circle cx="60" cy="60" r="22" fill="#FFFEF7"/>
</svg>
