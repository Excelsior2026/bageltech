name: PRISM Quality Gate

on:
  pull_request:
    paths:
      - ".github/workflows/prism-quality.yml"
      - "src/app/prism/**"
      - "src/app/api/prism/**"
      - "docs/PRISM_**"
      - "tests/prism.test.mjs"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prism-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run unit and structural tests
        run: npm test
      - name: Run lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
      - name: Whitespace check
        run: git diff --check
