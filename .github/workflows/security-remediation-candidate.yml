# TEMPORARY remediation harness. Remove before merging the dependency PR.
# It commits only reviewed npm manifest/lock changes back to this isolated branch
# after install, tests, typecheck, build and production security audit pass.
name: Candidate Dependency Security Remediation

on:
  push:
    branches: [fix/bageltech-security-deps]
    paths:
      - ".github/workflows/security-remediation-candidate.yml"

permissions:
  contents: write

jobs:
  propose-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Establish clean baseline
        run: npm ci
      - name: Upgrade Next.js and matching ESLint config in lockfile
        run: npm install --save --package-lock-only --ignore-scripts next@16.4.6 eslint-config-next@16.4.6
      - name: Attempt compatible transitive vulnerability corrections
        run: npm audit fix --package-lock-only --ignore-scripts || true
      - name: Check clean install from proposed lockfile
        run: npm ci
      - name: Test
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Diff check
        run: git diff --check
      - name: Commit verified dependency changes to isolated branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes to commit."
            exit 0
          fi
          git commit -m "fix(deps): update patched production dependency graph" \
            -m "AI-Model: GPT-6" \
            -m "AI-Provider: OpenAI" \
            -m "AI-Tool: ChatGPT-directed GitHub Actions" \
            -m "AI-Role: Author"
          git push origin HEAD:refs/heads/fix/bageltech-security-deps
